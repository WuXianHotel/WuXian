# ============================================================
# Nginx 单域名 + 路径分流（生产加固版）
# 路径：/etc/nginx/conf.d/hotel.conf
#   https://wuxian-hotel.online/api/...   → Node.js 后端 :3000
#   https://wuxian-hotel.online/admin/    → Vue3 SPA 静态文件
#   https://wuxian-hotel.online/uploads/  → 上传文件
#   https://wuxian-hotel.online/          → 跳到 /admin/
# ============================================================

# 后端 upstream
# max_fails/fail_timeout：30 秒内失败 3 次则熔断 30 秒（避免反复打挂 PM2）
# keepalive 64: 保持 64 个长连接复用，降低每次建链开销
upstream hotel_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
    keepalive 64;
    keepalive_timeout 60s;
}

# --- HTTP → HTTPS 强制跳转 ---
server {
    listen 80;
    listen [::]:80;
    server_name wuxian-hotel.online www.wuxian-hotel.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS 主入口 ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wuxian-hotel.online www.wuxian-hotel.online;

    # 证书（TrustAsia DV）
    ssl_certificate     /etc/ssl/wuxian-hotel/fullchain.pem;
    ssl_certificate_key /etc/ssl/wuxian-hotel/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling（提升 myssl 评分）
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/ssl/wuxian-hotel/fullchain.pem;
    resolver 119.29.29.29 223.5.5.5 valid=300s;
    resolver_timeout 5s;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 上传 10MB
    client_max_body_size 10M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # ── 健康检查（不写 access log）──────────────
    location = /health {
        proxy_pass http://hotel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # ── 后端 API（加 upstream 重试与 keepalive 复用）─
    location /api/ {
        proxy_pass http://hotel_backend;

        # HTTP/1.1 + 空 Connection 头 → 触发上游 keepalive
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 标准转发头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 关键：PM2 reload 瞬断时自动重试，不返 502 给客户端
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        # 禁掉 nginx 缓冲（流式响应更快）
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 16k;
    }

    # ── 上传文件 ────────────────────────────────
    location /uploads/ {
        alias /opt/hotel/service/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── 后台静态站点 /admin/ ────────────────────

    # 关键 1：assets/ 静态资源（带 hash） —— 优先前缀匹配 ^~ 抢在 /admin/ 之前
    #   - 找不到直接 404（不走 SPA 回退，避免 JS/CSS 拿到 HTML 内容）
    #   - 1 年长缓存，immutable
    location ^~ /admin/assets/ {
        alias /opt/hotel/admin/current/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 关键 2：index.html 永不缓存
    # 每次访问 HTML 都拿最新的，确保引用的静态资源 hash 是对的
    location = /admin/index.html {
        alias /opt/hotel/admin/current/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        expires -1;
    }

    # 后台 SPA 路由
    location /admin/ {
        alias /opt/hotel/admin/current/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # /admin（无尾斜杠）→ /admin/
    location = /admin {
        return 301 /admin/;
    }

    # 根路径默认跳到 /admin/
    location = / {
        return 301 /admin/;
    }

    # 屏蔽常见扫描探测
    location ~ /\.(env|git|svn|DS_Store) {
        deny all;
        return 404;
    }
    location ~ /(wp-admin|wp-login|wordpress) {
        deny all;
        return 404;
    }

    # 避免 favicon / robots 扫描刷错误日志
    location = /favicon.ico { log_not_found off; access_log off; return 204; }
    location = /robots.txt  { log_not_found off; access_log off; return 200 "User-agent: *\nDisallow: /\n"; }

    access_log /var/log/nginx/hotel-access.log;
    error_log  /var/log/nginx/hotel-error.log warn;
}
