# ============================================================
# Nginx 单域名 + 路径分流（简化版）
# 路径：/etc/nginx/conf.d/hotel.conf
#   https://wuxian-hotel.online/api/...   → Node.js 后端 :3000
#   https://wuxian-hotel.online/admin/    → Vue3 SPA 静态文件
#   https://wuxian-hotel.online/uploads/  → 上传文件
#   https://wuxian-hotel.online/          → 跳到 /admin/
# ============================================================

upstream hotel_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# --- HTTP → HTTPS 强制跳转 ---
server {
    listen 80;
    listen [::]:80;
    server_name wuxian-hotel.online www.wuxian-hotel.online;

    # ACME http-01 验证用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS 主入口 ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wuxian-hotel.online www.wuxian-hotel.online;

    ssl_certificate     /etc/letsencrypt/live/wuxian-hotel.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wuxian-hotel.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 上传 10MB
    client_max_body_size 10M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # ── 健康检查 ────────────────────────────────
    location = /health {
        proxy_pass http://hotel_backend;
        access_log off;
    }

    # ── 后端 API ────────────────────────────────
    location /api/ {
        proxy_pass http://hotel_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── 上传文件 ────────────────────────────────
    location /uploads/ {
        alias /opt/hotel/service/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── 后台静态站点 /admin/ ────────────────────
    # 注意 alias 必须以 / 结尾对应 location 末尾的 /
    location /admin/ {
        alias /opt/hotel/admin/current/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # /admin（无尾斜杠）→ /admin/
    location = /admin {
        return 301 /admin/;
    }

    # ── 根路径默认跳到 /admin/ ──────────────────
    location = / {
        return 301 /admin/;
    }

    access_log /var/log/nginx/hotel-access.log;
    error_log  /var/log/nginx/hotel-error.log warn;
}
