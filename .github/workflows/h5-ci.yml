name: H5 CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'h5/**'
      - '.github/workflows/h5-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'h5/**'

jobs:
  build:
    name: Build Vue3 + Vite (H5)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./h5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: h5/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: h5-dist-${{ github.sha }}
          path: h5/dist
          retention-days: 7
